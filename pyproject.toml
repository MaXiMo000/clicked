[project]
# "clicked" and "clicked-evidence" were both actually available on PyPI --
# no squatting to work around here, for once. The installed package stays
# `clicked` either way (an installed *command* isn't relevant: this is a
# library, imported from a caller's own browser-automation script, not a
# CLI tool -- see README's "Why no CLI").
name = "clicked-evidence"
version = "0.2.0"
description = "Deprecated: now part of receipt-evidence. Installs it and keeps old imports working."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["browser", "playwright", "testing", "evidence", "provenance", "e2e"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# Playwright is duck-typed, never imported here, so whichever version (or,
# in principle, another library with the same .on()/.remove_listener()
# shape) the caller already depends on is used as-is. receipt-evidence is
# the one real dependency this package has -- it's a hard one, not an
# extra, because capture()'s core network recording redacts every URL and
# POST body through receipt.redact before storing it (a credential in a
# query string or form submit is a real, common shape, not an edge case),
# and that safety shouldn't be something a caller has to opt into by
# installing an extra. receipt-evidence is itself dependency-free, so this
# stays a light install. snapshot()/diff() ride along on the same
# dependency for the optional watch_dir feature.
dependencies = ["receipt-evidence>=0.2.0"]

urls.Homepage = "https://github.com/MaXiMo000/clicked"
urls.Source = "https://github.com/MaXiMo000/clicked"
urls.Issues = "https://github.com/MaXiMo000/clicked/issues"
urls.Changelog = "https://github.com/MaXiMo000/clicked/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clicked*"]
